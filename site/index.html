<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's idea</title>
<meta name="description" content="One day-trading idea a day for large caps, with the odds printed on it, from the desk's rules. A candidate matched a rule; it is not a prediction.">
<style>
  :root {
    --bg: #0b0d10; --panel: #13161b; --line: #262a31; --ink: #f2f4f7; --ink-2: #aab1bb; --ink-3: #6b7380;
    --signal: #4ea1ff; --warn: #ff5c5c; --ok: #5bd39b; --badge: #1b1f26;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f9; --panel: #ffffff; --line: #e1e4ea; --ink: #10131a; --ink-2: #4b5260; --ink-3: #7b8290;
      --signal: #1f6fd6; --warn: #d12c2c; --ok: #1f8f5f; --badge: #eef1f5;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e1e4ea; --ink: #10131a; --ink-2: #4b5260; --ink-3: #7b8290;
    --signal: #1f6fd6; --warn: #d12c2c; --ok: #1f8f5f; --badge: #eef1f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { padding: 20px 16px 48px; max-width: 760px; margin: 0 auto; -webkit-font-smoothing: antialiased; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .when { color: var(--ink-2); font-size: 15px; }
  .theme { background: var(--badge); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
  .kicker { margin: 28px 0 6px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: 0; font-size: clamp(44px, 12vw, 96px); line-height: 1; letter-spacing: -.02em; font-weight: 800; }
  .verdict { margin: 10px 0 0; font-size: clamp(20px, 4.5vw, 30px); line-height: 1.3; font-weight: 600; }
  .verdict.warn { color: var(--warn); }
  .verdict.ok { color: var(--ok); }
  .big { margin: 22px 0 0; font-size: clamp(22px, 5vw, 34px); line-height: 1.35; font-weight: 600; }
  .big b { color: var(--signal); font-variant-numeric: tabular-nums; }
  .plain { margin: 16px 0 0; font-size: clamp(17px, 3.6vw, 21px); line-height: 1.5; color: var(--ink-2); }
  .plain b { color: var(--ink); }
  .badge { display: inline-block; background: var(--badge); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-right: 8px; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.signal { color: var(--signal); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; margin-top: 18px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
  .stat { flex: 1 1 140px; }
  .stat .k { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .stat .v { font-size: clamp(24px, 6vw, 36px); font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .s { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  ul.steps { margin: 12px 0 0; padding-left: 22px; font-size: 17px; line-height: 1.6; color: var(--ink-2); }
  ul.steps code, .plain code { font-family: var(--mono); font-size: .92em; background: var(--badge); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
  .small { font-size: 15px; color: var(--ink-2); line-height: 1.5; margin: 10px 0 0; }
  .others { margin-top: 10px; font-size: 16px; line-height: 1.6; color: var(--ink-2); }
  .others b { color: var(--ink); }
  footer { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--ink-3); font-size: 14px; line-height: 1.6; }
  footer a, .small a { color: var(--signal); text-decoration: none; }
  .hidden { display: none; }
  h2.sym2 { margin: 0; font-size: clamp(32px, 8vw, 56px); line-height: 1; letter-spacing: -.02em; font-weight: 800; }
  .divider { margin: 34px 0 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="when" id="when">loading today's board</div>
  <span>
    <a class="theme" href="#lock" target="_top">lock</a>
    <button class="theme" id="theme" type="button">light theme</button>
  </span>
</header>

<div id="main"></div>

<footer>
  Most people who day trade lose money. A candidate on this page matched a rule with a measured record; it is not a
  prediction and not a buy. Nothing trades without your typed yes.
  <a href="#full" target="_top">The full dashboard</a> has every table behind this page.
  <a href="#lock" target="_top">Lock the desk</a> when you are done.
</footer>

<script>
(function () {
  "use strict";
  var KEY = "idea-theme";
  function stored() { try { return window.localStorage.getItem(KEY); } catch (e) { return null; } }
  function store(t) { try { if (t) { window.localStorage.setItem(KEY, t); } else { window.localStorage.removeItem(KEY); } } catch (e) {} }
  function current() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) { return t; }
    try { return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch (e) { return "dark"; }
  }
  var s = stored();
  if (s) { document.documentElement.setAttribute("data-theme", s); }
  var btn = document.getElementById("theme");
  function label() { btn.textContent = current() === "dark" ? "light theme" : "dark theme"; }
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next); store(next); label();
  });
  label();

  function esc(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function num(x, d) { return (typeof x === "number" && isFinite(x)) ? x.toFixed(d == null ? 2 : d) : "n/a"; }
  function pct(x) { return (typeof x === "number" && isFinite(x)) ? Math.round(100 * x) + " %" : "n/a"; }
  function R(x) { return (typeof x === "number" && isFinite(x)) ? (x >= 0 ? "+" : "") + x.toFixed(2) + "R" : "n/a"; }
  function ci(c) { return (c && typeof c[0] === "number") ? "[" + R(c[0]) + ", " + R(c[1]) + "]" : ""; }
  function load(path) {
    // behind the lock the data arrives decrypted in memory (window.__DT, set by the lock screen); the fetch is for a plain local preview
    var name = path.replace(/^.*\//, "");
    if (window.__DT && window.__DT[name]) { return Promise.resolve(window.__DT[name]); }
    return fetch(path, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }

  function regimeWords(r) {
    if (!r || !r.daily) { return ""; }
    var d = r.daily;
    var parts = [];
    if (d.trend) { parts.push("SPY trend " + d.trend); }
    if (typeof d.vix === "number") { parts.push("VIX " + num(d.vix, 1) + (d.vix_bucket ? " (" + d.vix_bucket + ")" : "")); }
    if (r.live && r.live.spy && typeof r.live.spy.gap_pct === "number") { parts.push("SPY gap " + (r.live.spy.gap_pct >= 0 ? "+" : "") + num(r.live.spy.gap_pct, 2) + " %"); }
    if (r.live && r.live.futures && r.live.futures.nq && typeof r.live.futures.nq.gap_pct === "number") { parts.push("NQ overnight " + (r.live.futures.nq.gap_pct >= 0 ? "+" : "") + num(r.live.futures.nq.gap_pct, 2) + " %"); }
    return parts.join(" · ");
  }

  function flagWords(c) {
    var out = [];
    (c.flags || []).forEach(function (f) {
      if (f === "late") { out.push("LATE: the entry bar closed " + ((c.signal || {}).bars_since_entry || 0) + " bars ago; a late entry is a different trade"); }
      else if (f === "earnings") { out.push("REPORTS SOON: " + ((c.earnings || {}).reason || "earnings")); }
      else if (f === "earnings_week") { out.push("earnings within the week"); }
      else if (f === "regime_against") { out.push("this rule lost money in today's kind of market"); }
      else if (f === "watch_only") { out.push("WATCH ONLY: the rule has not cleared the lab's gate"); }
      else if (f === "untested") { out.push("UNTESTED: the lab has not run"); }
      else if (f === "moving") { out.push("already moving " + (typeof c.move_pct === "number" ? (c.move_pct >= 0 ? "+" : "") + num(c.move_pct, 2) + " %" : "")); }
      else if (f.indexOf("intel:") === 0) { out.push("intel: " + f.slice(6).replace(/_/g, " ")); }
      else if (f === "news") { out.push("news tagged this morning"); }
      else if (f === "daily_hit") { out.push("also on the pre-market scan"); }
    });
    return out;
  }

  function labWords(c) {
    var lab = c.lab || {}, o = lab.oos || null;
    if (!o || !o.n) { return "No measured record for this rule yet."; }
    var slice = lab.regime_slice;
    var s = "Out of sample this rule hit the target first <b>" + pct(o.win_rate) + "</b> of the time and made <b>" + R(o.exp_R) + "</b> a trade after costs " +
      esc(ci(o.exp_ci95)) + ", over " + o.n.toLocaleString() + " trades.";
    if (slice && slice.stats && slice.stats.n) {
      s += " In today's kind of market (" + esc(slice.tag) + "): " + R(slice.stats.exp_R) + " a trade " + esc(ci(slice.stats.exp_ci95)) + ", n " + slice.stats.n.toLocaleString() + ".";
    }
    return s;
  }

  function tmWords(c) {
    var t = c.timemachine;
    if (!t || t.error || typeof t.p_target !== "number") { return ""; }
    return "Replayed " + ((t.replays || 10000).toLocaleString()) + " times from this stock's own last 60 days: target first <b>" + pct(t.p_target) +
      "</b>, stop first <b>" + pct(t.p_stop) + "</b>, neither <b>" + pct(t.p_neither) + "</b>." + (t.verdict ? " " + esc(t.verdict) : "");
  }

  function statusBadge(c) {
    var st = (c.lab || {}).status || "untested";
    if (st === "approved") { return '<span class="badge ok">approved by the lab</span>'; }
    if (st === "watch") { return '<span class="badge warn">watch only</span>'; }
    return '<span class="badge">' + esc(st) + "</span>";
  }

  function renderLive(d, r) {
    var fresh = (d.candidates || []).filter(function (c) { return (c.flags || []).indexOf("late") < 0; });
    var late = (d.candidates || []).filter(function (c) { return (c.flags || []).indexOf("late") >= 0; });
    var top = fresh[0] || late[0] || null;
    var html = "";
    if (!top) {
      html += '<div class="kicker">today</div><h1>Nothing.</h1>' +
        '<p class="verdict">No chart matched an approved rule by ' + esc(d.cutoff12 || d.as_of) + '. That is a normal day. Sit on your hands.</p>' +
        '<p class="plain">' + esc(regimeWords(r)) + "</p>";
      return html;
    }
    var sig = top.signal || {};
    var approved = (top.lab || {}).status === "approved";
    var isLate = (top.flags || []).indexOf("late") >= 0;
    html += '<div class="kicker">the rules\' board idea, ' + esc(d.as_of || "") + "</div>";
    html += "<h1>" + esc(top.symbol) + "</h1>";
    html += '<p class="verdict ' + (approved && !isLate ? "ok" : "warn") + '">' +
      (approved && !isLate ? "This rule has a measured edge. Still a coin flip on any one day." :
       isLate ? "Too late. The bar that mattered already closed." :
       "No approved rule today. This is the best of the watch list, and the lab has not cleared it.") + "</p>";
    html += '<div class="card">' + statusBadge(top) + '<span class="badge signal">' + esc(top.setup || "") + "</span>" +
      '<p class="big">Buy above <b>' + num(sig.entry) + "</b> · stop <b>" + num(sig.stop) + "</b> · target <b>" + num(sig.target) + "</b></p>" +
      '<div class="row">' +
      '<div class="stat"><div class="k">risk a share</div><div class="v">' + num(sig.risk_per_share) + '</div><div class="s">' + esc(sig.target_r) + "R target</div></div>" +
      '<div class="stat"><div class="k">entry bar closed</div><div class="v">' + esc(sig.entry_time || "") + '</div><div class="s">' + esc(top.name || "") + "</div></div>" +
      '<div class="stat"><div class="k">last close</div><div class="v">' + num(top.last_close) + '</div><div class="s">' + (typeof top.move_pct === "number" ? (top.move_pct >= 0 ? "+" : "") + num(top.move_pct, 2) + " % on the day" : "") + "</div></div>" +
      "</div>" +
      '<p class="plain">' + labWords(top) + "</p>" +
      (tmWords(top) ? '<p class="plain">' + tmWords(top) + "</p>" : "") +
      (flagWords(top).length ? '<p class="plain"><b>Mind:</b> ' + esc(flagWords(top).join("; ")) + ".</p>" : "") +
      "</div>";
    html += '<div class="card"><div class="kicker" style="margin-top:0">if you take it</div><ul class="steps">' +
      "<li>Risk no more than your max loss a trade: the budget manager sizes it (<code>size.py --write</code>).</li>" +
      "<li>The risk manager must say PASS (<code>check.py</code>); the broker ticket needs your typed yes.</li>" +
      "<li>Flat by 15:55 ET, win or lose. The stop is a plan, not a guarantee.</li>" +
      '</ul><p class="small">In Claude: <code>/trader-desk pick ' + esc(top.symbol) + "</code> hands this exact plan to the upstream chain.</p></div>";
    var rest = fresh.slice(1, 4);
    if (rest.length) {
      html += '<div class="card"><div class="kicker" style="margin-top:0">also matched</div><div class="others">' + rest.map(function (c) {
        var g = c.signal || {};
        return "<b>" + esc(c.symbol) + "</b> " + esc(c.setup || "") + ", above " + num(g.entry) + ", stop " + num(g.stop) + ", target " + num(g.target) +
          ((c.lab || {}).status === "approved" ? "" : " (watch only)");
      }).join("<br>") + "</div></div>";
    }
    html += shortSide(d);
    var ex = ((d.excluded || {}).earnings || []);
    html += '<p class="small">' + esc(regimeWords(r)) + (ex.length ? " · " + ex.length + " names left out for earnings" : "") +
      (d.universe ? " · " + d.universe + " large caps scanned" : "") + "</p>";
    return html;
  }

  function shortSide(d) {
    var shorts = (d.candidates_short || []).filter(function (c) { return (c.flags || []).indexOf("late") < 0; });
    if (!shorts.length) { return ""; }
    var c = shorts[0], g = c.signal || {};
    var rk = window.__RANKINGS || null;
    var refused = null;
    if (rk && rk.lists) {
      var all = [].concat(rk.lists.most_dangerous_shorts || [], rk.lists.top_short_candidates || []);
      var hit = all.filter(function (x) { return x.symbol === c.symbol && x.side === "short"; })[0];
      if (hit) { refused = hit.verdict === "do_not_trade" ? (hit.reasons || []).join("; ") : ""; }
    }
    return '<div class="card"><div class="kicker" style="margin-top:0">the short side</div><p class="plain"><b>' + esc(c.symbol) + "</b> matched " + esc(c.setup || "") +
      ": sell short below " + num(g.entry) + ", stop " + num(g.stop) + " above, target " + num(g.target) +
      ((c.lab || {}).status === "approved" ? "" : " (watch only)") + ". " +
      (refused ? '<span class="badge warn">do not short</span> ' + esc(refused) + ". " : "") +
      "Research only: nothing places a short order, and a short can lose more than the stake.</p></div>";
  }

  function etNow() {
    // the New York date and minute of the day, from Intl (no library)
    try {
      var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
      var o = {};
      parts.forEach(function (x) { o[x.type] = x.value; });
      return { date: o.year + "-" + o.month + "-" + o.day, minutes: (parseInt(o.hour, 10) % 24) * 60 + parseInt(o.minute, 10) };
    } catch (e) {
      var d = new Date();
      return { date: d.toISOString().slice(0, 10), minutes: 12 * 60 };
    }
  }
  function etToday() { return etNow().date; }

  function pci(c) {   // a rate's interval in points (the board's ci() prints R)
    return (c && typeof c[0] === "number" && typeof c[1] === "number") ? " [" + Math.round(100 * c[0]) + ", " + Math.round(100 * c[1]) + "]" : "";
  }
  function pctci(st, k) { return st && typeof st[k + "_rate"] === "number" ? pct(st[k + "_rate"]) + pci(st[k + "_ci"]) : "n/a"; }

  function pickRecord(pk) {
    var oos = pk.oos || {};
    var o = (oos.pick || {}).all || {}, b = (oos.base || {}).all || {}, t = (oos.highest_atr || {}).all || {};
    var live = pk.live || {};
    var s = "";
    if (o.n) {
      s += "Out of sample over " + o.n + " mornings (" + (pk.configs_tested || 3) + " rules tested), the pick closed 2 % or more above its open on " + pctci(o, "up") +
        " and 2 % or more below on " + pctci(o, "dn") + "; between 2 % and 5 % above on " + pctci(o, "band") +
        "; it traded 2 % above its open at some point on " + pctci(o, "touch_up") + " of them and 2 % below on " + pctci(o, "touch_dn") + ".";
      if (b.n) {
        s += " Any large cap (the base rates): up " + pctci(b, "up") + ", down " + pctci(b, "dn") + ", 2 to 5 % up " + pctci(b, "band") + ", touched +2 % " + pctci(b, "touch_up") +
          ", touched -2 % " + pctci(b, "touch_dn") + ".";
      }
      if (t.n) {
        s += " The most volatile liquid name each morning moved 2 % either way on " + pctci(t, "move") + " (the pick: " + pctci(o, "move") + ").";
      }
    }
    s += " Live: " + esc(live.words || "no graded pick yet") + (live.small_sample ? " (a small sample)" : "") + ".";
    return s;
  }

  function leftOut(pk) {
    var parts = [];
    if (pk.reporting_today) { parts.push(pk.reporting_today + " report earnings today"); }
    if (pk.reacting_today) { parts.push(pk.reacting_today + " react to a report since the previous session"); }
    var sp = pk.special_today || [];
    if (sp.length) {
      parts.push("special situations: " + sp.map(function (x) { return esc(x.symbol) + " (" + esc(x.reason) + ")"; }).join(", "));
    }
    if (pk.behind_today) { parts.push(pk.behind_today + " a session behind in the price store"); }
    if (pk.reporting_source && String(pk.reporting_source).indexOf("Nasdaq calendar for") !== 0) {
      parts.push("the earnings calendar: " + esc(pk.reporting_source));
    }
    return parts.length ? '<p class="small"><b>Left out this morning:</b> ' + parts.join("; ") + ". Their day is news the history does not describe.</p>" : "";
  }

  function sgn(x) { return (typeof x === "number" && isFinite(x)) ? (x >= 0 ? "+" : "") + x.toFixed(2) : "n/a"; }

  function todayLine(pk) {
    var it = pk.intraday || {}, x = ((it.names || {})[pk.pick.symbol]) || null;
    if (!x || x.error || it.date !== pk.date) { return ""; }
    var path = "high " + sgn(x.high_pct) + " %, low " + sgn(x.low_pct) + " % against its open" +
      (x.first_touch ? "; " + (x.first_touch === "up" ? "+" : "-") + "2 % came first, at " + esc(x.first_touch_time) : "");
    if (x.closed) {
      return '<p class="plain"><b>Today:</b> ' + esc(pk.pick.symbol) + " closed " + sgn(x.from_open_pct) + " % from its open (" + path + ")" +
        (x.in_band ? ", inside the 2 to 5 % band" : "") + ". One morning is a count of one; the record below is what the odds rest on.</p>";
    }
    return '<p class="plain"><b>So far today</b> (as of ' + esc(x.as_of) + " ET): " + sgn(x.from_open_pct) + " % from its open (" + path + ").</p>" +
      (it.first_hour_words ? '<p class="small"><b>The first hour:</b> ' + esc(it.first_hour_words) + ".</p>" : "");
  }

  function notes(pk) {
    var n = [];
    if (pk.half_day_note) { n.push(esc(pk.half_day_note)); }
    if (pk.refreshed_at) { n.push("the pick was posted at " + esc(pk.cutoff) + " ET and the card refreshed at " + esc(pk.refreshed_at) + " ET (the latest pre-market print; the pick does not change)"); }
    if (pk.store_stale) { n.push("the price store ends " + esc(pk.store_through) + ", not the previous session"); }
    if (pk.late) { n.push("this card was written after 9:25 ET, so it is not counted in the live record"); }
    return n.length ? '<p class="small"><b>Note:</b> ' + n.join("; ") + ".</p>" : "";
  }

  function renderPick(pk) {
    var now = etNow(), today = now.date;
    function waiting(next) {
      if (next && today < next) { return ["Closed today.", "The market is closed today. The next pick posts at about 8:15 ET on " + esc(next) + "."]; }
      if (now.minutes < 8 * 60 + 25) { return ["Not yet.", "Today's pick posts at about 8:15 ET, from what is known by 8:05."]; }
      if (now.minutes < 9 * 60 + 25) { return ["Not posted yet.", "The morning job has not posted today's pick; it can until 9:25 ET."]; }
      return ["No pick today.", "The morning job did not post a pick today, and nothing posts after 9:25 ET."];
    }
    if (!pk || !pk.date) {
      var w0 = waiting((pk || {}).next_session || "");
      return '<div class="kicker">the 8:25 pick</div><h1>' + w0[0] + '</h1><p class="verdict">' + w0[1] + "</p>";
    }
    if (pk.date !== today) {
      var w = waiting(pk.next_session || ""), head = w[0], words = w[1];
      var last = ((pk.live || {}).last || []).slice(-1)[0];
      var same = pk.pick && last && last.date === pk.date && last.symbol === pk.pick.symbol && last.status === "graded";
      return '<div class="kicker">the 8:25 pick</div><h1>' + head + '</h1><p class="verdict">' + words + "</p>" +
        '<p class="plain">The last pick was for ' + esc(pk.date) + (pk.pick ? ": <b>" + esc(pk.pick.symbol) + "</b>" : ": no pick") +
        (same ? ", which closed " + (last.oc_pct >= 0 ? "+" : "") + num(last.oc_pct, 2) + " % from its open" : "") + ".</p>" +
        '<p class="small">' + pickRecord(pk) + "</p>";
    }
    if (!pk.pick) {
      return '<div class="kicker">the 8:25 pick, ' + esc(pk.date) + (pk.cutoff ? ", data as of " + esc(pk.cutoff) + " ET" : "") + '</div><h1>No pick.</h1>' +
        '<p class="verdict">' + esc(pk.no_pick_words || "Nothing cleared the bar this morning.") + "</p>" +
        leftOut(pk) + notes(pk) + '<p class="small">' + pickRecord(pk) + "</p>";
    }
    var p = pk.pick, pm = p.premarket || {};
    var up = pk.claim === "up";
    var oos = pk.oos || {};
    var rec = (oos.pick || {}).all || {}, base = (oos.base || {}).all || {};
    var likely = rec.move_ci && typeof rec.move_ci[0] === "number" && rec.move_ci[0] > 0.5;
    var verdict = up ? "More likely to close 2 % or more ABOVE its open than below it: past picks did on " + pctci(rec, "up") + " of mornings, below on " + pctci(rec, "dn") + "." :
      (likely ? "Likely to MOVE 2 % or more from its open today: past picks did on " : "It may MOVE 2 % or more from its open today: past picks did on ") +
      pctci(rec, "move") + " of mornings. " +
      (pk.direction_kind === "down" ? "They closed 2 % down more often than 2 % up." : "Up or down, the record cannot tell.");
    var html = '<div class="kicker">the 8:25 pick, ' + esc(pk.date) + ', data as of ' + esc(pk.cutoff) + ' ET</div>' +
      "<h1>" + esc(p.symbol) + "</h1>" +
      '<p class="verdict ' + (up ? "ok" : "warn") + '">' + verdict + "</p>" + todayLine(pk) +
      '<div class="card"><div class="row">' +
      '<div class="stat"><div class="k">past picks closed 2 % up</div><div class="v">' + pct(rec.up_rate) + '</div><div class="s">' + pci(rec.up_ci).trim() +
        " · any large cap " + pctci(base, "up") + "</div></div>" +
      '<div class="stat"><div class="k">and closed 2 % down</div><div class="v">' + pct(rec.dn_rate) + '</div><div class="s">' + pci(rec.dn_ci).trim() +
        " · any large cap " + pctci(base, "dn") + "</div></div>" +
      '<div class="stat"><div class="k">pre-market' + (pm.time ? " at " + esc(pm.time) : "") + '</div><div class="v">' +
        (typeof pm.vs_prev_close_pct === "number" ? (pm.vs_prev_close_pct >= 0 ? "+" : "") + num(pm.vs_prev_close_pct, 2) + " %" : "n/a") +
      '</div><div class="s">' + (typeof pm.last === "number" ? num(pm.last) + " vs " + num(pm.prev_close) + " close (shown, not scored)" : "no pre-market print") + "</div></div>" +
      "</div>" +
      '<p class="plain"><b>Why this name:</b> ' + esc((p.reasons || []).join("; ")) + ".</p>" +
      '<p class="small">Those numbers are the record of past picks (' + (rec.n || 0) + " mornings, out of sample). The model ranks the names; its own " +
        "top-bin rates are in-sample and shared by " + (p.bin_shared || 1) + " names this morning, so they are not this name's odds.</p>" +
      '<p class="plain"><b>Direction:</b> ' + esc(pk.direction || "") + ".</p>" +
      '<p class="plain"><b>The record:</b> ' + pickRecord(pk) + "</p>" + leftOut(pk) + notes(pk) +
      '<p class="small">The odds are counts over past mornings, refit as they go: a pick is not a prediction and not a buy. A 2 % day that happens one time in three does not happen two times in three.</p></div>';
    var rest = (pk.ranked || []).filter(function (r) { return r.symbol !== p.symbol; }).slice(0, 5);
    if (rest.length) {
      html += '<div class="card"><div class="kicker" style="margin-top:0">the next five, in the model\'s order</div><div class="others">' + rest.map(function (r) {
        var a = (r.raw || {}).atr_pct;
        return "<b>" + esc(r.symbol) + "</b>" + (typeof a === "number" ? " moves " + num(a, 1) + " % a day (ATR)" : "");
      }).join("<br>") + "</div></div>";
    }
    return html;
  }

  function renderMorning(d, r) {
    var ex = ((d.exclusions || {}).earnings || []);
    var hits = (d.daily_hits || []).slice(0, 5);
    var html = '<div class="kicker">the rules\' board, ' + esc(d.date || "") + ", before the open</div><h1>Not yet.</h1>" +
      '<p class="verdict">The idea comes at 10:00 ET. The rules need the first 15 minutes of trading to find it.</p>' +
      '<p class="plain">' + esc(regimeWords(r) || "No regime read yet.") + "</p>";
    if (ex.length) {
      html += '<div class="card"><div class="kicker" style="margin-top:0">not today, they report</div><p class="plain">' +
        esc(ex.slice(0, 12).map(function (e) { return e.symbol; }).join(", ")) + (ex.length > 12 ? " and " + (ex.length - 12) + " more" : "") + "</p></div>";
    }
    if (hits.length) {
      html += '<div class="card"><div class="kicker" style="margin-top:0">on the pre-market scan</div><div class="others">' +
        hits.map(function (h) { return "<b>" + esc(h.symbol) + "</b> " + esc((h.setups || []).join(", ")); }).join("<br>") +
        '</div><p class="small">A scan is a list of charts that matched a rule, not a list of stocks to buy.</p></div>';
    }
    return html;
  }

  Promise.all([load("data/desk.json"), load("data/regime.json"), load("data/rankings.json"), load("data/pick.json")]).then(function (res) {
    var d = res[0], r = res[1], rk = res[2], pk = res[3];
    var when = document.getElementById("when");
    var main = document.getElementById("main");
    window.__RANKINGS = rk || null;
    var html = renderPick(pk) + '<div class="divider"></div>';
    if (!d) {
      when.textContent = pk && pk.date ? "pick for " + pk.date : "no board yet";
      main.innerHTML = html + '<div class="kicker">the rules\' board</div><p class="verdict">The desk has not run. The first board comes at 10:00 ET on a trading day.</p>';
      return;
    }
    when.textContent = (d.mode === "live" ? "board as of " : "plan for ") + (d.as_of || d.date || "");
    var board = d.mode === "live" ? renderLive(d, r) : renderMorning(d, r);
    main.innerHTML = html + board.replace(/<h1>/g, '<h2 class="sym2">').replace(/<\/h1>/g, "</h2>");
  });
})();
</script>
</body>
</html>
